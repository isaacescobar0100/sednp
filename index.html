<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/sindika.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0F1B3D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sindika" />
    <title>Sindika</title>
    <!-- Marca cacheada (nombre + logo) del sindicato de este dominio: se aplica
         ANTES de cargar la app para evitar el parpadeo "Sindika → nombre real"
         en el título y el favicon de la pestaña. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('tenantBrand:' + location.hostname)
          if (!raw) return
          var b = JSON.parse(raw)
          if (b && b.nombre) document.title = b.nombre
          if (b && b.logo) {
            var l = document.querySelector("link[rel='icon']") || document.createElement('link')
            l.rel = 'icon'; l.href = b.logo
            document.head.appendChild(l)
          }
        } catch (e) { /* sin storage / json inválido */ }
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Splash estático: se pinta al instante y React lo reemplaza al montar
           (evita la pantalla en blanco en la primera carga / tras un deploy). -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#0F1B3D">
        <img src="/sindika-dark.png" alt="Sindika" style="height:54px;width:auto" />
        <div style="height:26px;width:26px;border-radius:9999px;border:3px solid rgba(255,255,255,.22);border-top-color:#C9973B;animation:bootspin .8s linear infinite"></div>
      </div>
      <style>@keyframes bootspin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
